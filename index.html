<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Kottala Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .instructions {
            color: #7f8c8d;
            max-width: 600px;
            margin: 0 auto 20px;
            line-height: 1.6;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 10px;
        }
        
        .image-card {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background-color: white;
            position: relative;
        }
        
        .image-container {
            height: 250px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ecf0f1;
        }
        
        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
        }
        
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .image-card:hover .image-container img {
            transform: scale(1.05);
        }
        
        .download-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            color: #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            border: none;
            z-index: 10;
        }
        
        .image-card:hover .download-btn {
            opacity: 1;
            transform: translateY(0);
        }
        
        .download-btn:hover {
            background: #3498db;
            color: white;
            transform: scale(1.1);
        }
        
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }
        
        .fullscreen-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .fullscreen-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 30px;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 1001;
        }
        
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 30px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }
        
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .prev-btn {
            left: 20px;
        }
        
        .next-btn {
            right: 20px;
        }
        
        .upload-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.2s ease;
            margin-top: 10px;
        }
        
        .upload-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 15px;
            }
            
            .image-container {
                height: 180px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .download-btn {
                opacity: 1;
                transform: translateY(0);
                width: 35px;
                height: 35px;
            }
        }
        
        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }
            
            .image-container {
                height: 150px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Kottala Gallery</h1>
            <p class="instructions">This gallery displays images from your local storage. Click on any image to view it in fullscreen.</p>
            <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
            <button class="upload-btn" onclick="document.getElementById('file-input').click()">
                <i class="fas fa-plus"></i> Add More Images
            </button>
        </header>
        
        <div class="gallery" id="image-gallery">
            <!-- Images will be dynamically inserted here -->
        </div>
        
        <div class="fullscreen-overlay" id="fullscreen-overlay">
            <button class="close-btn" id="close-btn">&times;</button>
            <button class="nav-btn prev-btn" id="prev-btn">&lt;</button>
            <img class="fullscreen-image" id="fullscreen-image" src="" alt="">
            <button class="nav-btn next-btn" id="next-btn">&gt;</button>
        </div>
        
        <footer>
            <p>Created with ❤️ | Kottala Image Gallery with Download Options</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gallery = document.getElementById('image-gallery');
            const overlay = document.getElementById('fullscreen-overlay');
            const fullscreenImage = document.getElementById('fullscreen-image');
            const closeBtn = document.getElementById('close-btn');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const fileInput = document.getElementById('file-input');
            
            let currentImageIndex = 0;
            let images = [];
            
            // Function to load images from local storage
            function loadImagesFromStorage() {
                const storedImages = JSON.parse(localStorage.getItem('galleryImages')) || [];
                images = storedImages;
                
                if (images.length === 0) {
                    gallery.innerHTML = '<p class="instructions" style="text-align:center;width:100%;">No images found. Please add images using the button above.</p>';
                    return;
                }
                
                renderGallery();
            }
            
            // Function to render the gallery
            function renderGallery() {
                gallery.innerHTML = '';
                
                images.forEach((imageData, index) => {
                    const imageCard = document.createElement('div');
                    imageCard.className = 'image-card';
                    
                    const imageContainer = document.createElement('div');
                    imageContainer.className = 'image-container';
                    
                    const img = document.createElement('img');
                    img.src = imageData;
                    img.alt = 'Gallery image';
                    img.loading = 'lazy';
                    
                    img.addEventListener('click', () => openFullscreen(index));
                    
                    // Create download button
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'download-btn';
                    downloadBtn.title = 'Download image';
                    downloadBtn.innerHTML = '<i class="fas fa-download"></i>';
                    
                    // Add download functionality
                    downloadBtn.addEventListener('click', (e) => {
                        e.stopPropagation(); // Prevent opening fullscreen when downloading
                        downloadImage(imageData, `image-${index + 1}.jpg`);
                    });
                    
                    imageContainer.appendChild(img);
                    imageCard.appendChild(imageContainer);
                    imageCard.appendChild(downloadBtn);
                    gallery.appendChild(imageCard);
                });
            }
            
            // Function to download an image
            function downloadImage(dataUrl, filename) {
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
            
            // Function to open image in fullscreen
            function openFullscreen(index) {
                currentImageIndex = index;
                fullscreenImage.src = images[index];
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
            
            // Function to close fullscreen view
            function closeFullscreen() {
                overlay.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
            
            // Navigate to previous image
            function showPrevImage() {
                currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
                fullscreenImage.src = images[currentImageIndex];
            }
            
            // Navigate to next image
            function showNextImage() {
                currentImageIndex = (currentImageIndex + 1) % images.length;
                fullscreenImage.src = images[currentImageIndex];
            }
            
            // Handle file selection
            function handleFileSelect(event) {
                const files = event.target.files;
                
                if (files.length === 0) return;
                
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    
                    if (!file.type.match('image.*')) continue;
                    
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        images.push(e.target.result);
                        localStorage.setItem('galleryImages', JSON.stringify(images));
                        renderGallery();
                    };
                    
                    reader.readAsDataURL(file);
                }
                
                // Reset the file input
                fileInput.value = '';
            }
            
            // Event listeners
            closeBtn.addEventListener('click', closeFullscreen);
            prevBtn.addEventListener('click', showPrevImage);
            nextBtn.addEventListener('click', showNextImage);
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) closeFullscreen();
            });
            fileInput.addEventListener('change', handleFileSelect);
            
            // Keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (!overlay.classList.contains('active')) return;
                
                if (e.key === 'Escape') closeFullscreen();
                if (e.key === 'ArrowLeft') showPrevImage();
                if (e.key === 'ArrowRight') showNextImage();
            });
            
            // Load images on page load
            loadImagesFromStorage();
        });
    </script>
</body>
</html>
