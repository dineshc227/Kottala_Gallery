<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kottala Image Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c 0%, #b21f1f 50%, #fdbb2d 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .instructions {
            color: #e0e0e0;
            max-width: 600px;
            margin: 0 auto 20px;
            line-height: 1.6;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 10px;
        }
        
        .image-card {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            position: relative;
        }
        
        .image-container {
            height: 250px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .image-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }
        
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .image-card:hover .image-container img {
            transform: scale(1.1);
        }
        
        .image-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }
        
        .image-card:hover .image-actions {
            opacity: 1;
            transform: translateY(0);
        }
        
        .action-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            color: #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            border: none;
            transition: all 0.3s ease;
        }
        
        .action-btn:hover {
            background: #3498db;
            color: white;
            transform: scale(1.1);
        }
        
        .folder-info {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-size: 1.2rem;
        }
        
        .folder-info i {
            color: #fdbb2d;
            margin-right: 10px;
        }
        
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }
        
        .fullscreen-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .fullscreen-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }
        
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 30px;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 1001;
        }
        
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 30px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }
        
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .prev-btn {
            left: 20px;
        }
        
        .next-btn {
            right: 20px;
        }
        
        .upload-btn {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(to right, #3498db, #2ecc71);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .upload-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .storage-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        
        .progress-bar {
            height: 10px;
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
            margin: 0 15px;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(to right, #2ecc71, #3498db);
            border-radius: 5px;
            width: 0%;
            transition: width 0.5s ease;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #e0e0e0;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 15px;
            }
            
            .image-container {
                height: 180px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .image-actions {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }
            
            .image-container {
                height: 150px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .storage-info {
                flex-direction: column;
                gap: 10px;
            }
            
            .progress-bar {
                width: 100%;
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-folder"></i> Kottala Image Gallery</h1>
            <p class="instructions">All images are stored in your browser's Kottala folder. Add images using the button below.</p>
            <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
            <button class="upload-btn" onclick="document.getElementById('file-input').click()">
                <i class="fas fa-plus"></i> Add Images to Kottala Folder
            </button>
        </header>
        
        <div class="folder-info">
            <i class="fas fa-database"></i> <span id="image-count">0 images</span> stored in Kottala folder
        </div>
        
        <div class="gallery" id="image-gallery">
            <!-- Images will be dynamically inserted here -->
        </div>
        
        <div class="storage-info">
            <span>Storage Usage:</span>
            <div class="progress-bar">
                <div class="progress" id="storage-progress"></div>
            </div>
            <span id="storage-text">0 MB / 5 MB</span>
        </div>
        
        <div class="fullscreen-overlay" id="fullscreen-overlay">
            <button class="close-btn" id="close-btn">&times;</button>
            <button class="nav-btn prev-btn" id="prev-btn">&lt;</button>
            <img class="fullscreen-image" id="fullscreen-image" src="" alt="">
            <button class="nav-btn next-btn" id="next-btn">&gt;</button>
        </div>
        
        <footer>
            <p>Created with ❤️ | Kottala Image Gallery | Images stored in browser storage</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gallery = document.getElementById('image-gallery');
            const overlay = document.getElementById('fullscreen-overlay');
            const fullscreenImage = document.getElementById('fullscreen-image');
            const closeBtn = document.getElementById('close-btn');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const fileInput = document.getElementById('file-input');
            const imageCount = document.getElementById('image-count');
            const storageProgress = document.getElementById('storage-progress');
            const storageText = document.getElementById('storage-text');
            
            let currentImageIndex = 0;
            let images = [];
            let db;
            const DB_NAME = 'KottalaImageGallery';
            const STORE_NAME = 'images';
            const MAX_STORAGE = 5 * 1024 * 1024; // 5MB
            
            // Initialize the database
            function initDatabase() {
                const request = indexedDB.open(DB_NAME, 1);
                
                request.onerror = function(event) {
                    console.error('IndexedDB error:', event.target.error);
                    alert('Failed to initialize database. Please check if your browser supports IndexedDB.');
                };
                
                request.onsuccess = function(event) {
                    db = event.target.result;
                    loadImagesFromDatabase();
                    updateStorageInfo();
                };
                
                request.onupgradeneeded = function(event) {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                        store.createIndex('timestamp', 'timestamp', { unique: false });
                    }
                };
            }
            
            // Load images from the database
            function loadImagesFromDatabase() {
                if (!db) return;
                
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();
                
                request.onsuccess = function() {
                    images = request.result;
                    imageCount.textContent = images.length + ' image' + (images.length !== 1 ? 's' : '');
                    
                    if (images.length === 0) {
                        gallery.innerHTML = '<p class="instructions" style="text-align:center;width:100%;">No images found in Kottala folder. Please add images using the button above.</p>';
                        return;
                    }
                    
                    renderGallery();
                };
                
                request.onerror = function() {
                    console.error('Error loading images from database');
                };
            }
            
            // Calculate storage usage
            function calculateStorageUsage() {
                let totalSize = 0;
                for (const image of images) {
                    // Approximate size based on base64 string length
                    totalSize += Math.floor((image.data.length * 3) / 4);
                }
                return totalSize;
            }
            
            // Update storage info UI
            function updateStorageInfo() {
                const used = calculateStorageUsage();
                const usedMB = (used / 1024 / 1024).toFixed(2);
                const maxMB = (MAX_STORAGE / 1024 / 1024).toFixed(2);
                const percentage = Math.min(100, (used / MAX_STORAGE) * 100);
                
                storageProgress.style.width = percentage + '%';
                storageText.textContent = usedMB + ' MB / ' + maxMB + ' MB';
                
                // Change color based on usage
                if (percentage > 90) {
                    storageProgress.style.background = 'linear-gradient(to right, #e74c3c, #c0392b)';
                } else if (percentage > 70) {
                    storageProgress.style.background = 'linear-gradient(to right, #f39c12, #e67e22)';
                } else {
                    storageProgress.style.background = 'linear-gradient(to right, #2ecc71, #3498db)';
                }
            }
            
            // Render the gallery
            function renderGallery() {
                gallery.innerHTML = '';
                
                images.forEach((image, index) => {
                    const imageCard = document.createElement('div');
                    imageCard.className = 'image-card';
                    
                    const imageContainer = document.createElement('div');
                    imageContainer.className = 'image-container';
                    
                    const img = document.createElement('img');
                    img.src = image.data;
                    img.alt = 'Gallery image';
                    img.loading = 'lazy';
                    
                    img.addEventListener('click', () => openFullscreen(index));
                    
                    // Create action buttons
                    const imageActions = document.createElement('div');
                    imageActions.className = 'image-actions';
                    
                    // Download button
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'action-btn';
                    downloadBtn.title = 'Download image';
                    downloadBtn.innerHTML = '<i class="fas fa-download"></i>';
                    downloadBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        downloadImage(image.data, `kottala-image-${image.id}.jpg`);
                    });
                    
                    // Delete button
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'action-btn';
                    deleteBtn.title = 'Delete image';
                    deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteImage(image.id);
                    });
                    
                    imageActions.appendChild(downloadBtn);
                    imageActions.appendChild(deleteBtn);
                    
                    imageContainer.appendChild(img);
                    imageCard.appendChild(imageContainer);
                    imageCard.appendChild(imageActions);
                    gallery.appendChild(imageCard);
                });
                
                updateStorageInfo();
            }
            
            // Download an image
            function downloadImage(dataUrl, filename) {
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
            
            // Delete an image from the database
            function deleteImage(id) {
                if (!db) return;
                
                if (confirm('Are you sure you want to delete this image from the Kottala folder?')) {
                    const transaction = db.transaction([STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.delete(id);
                    
                    request.onsuccess = function() {
                        // Remove from local array
                        images = images.filter(img => img.id !== id);
                        imageCount.textContent = images.length + ' image' + (images.length !== 1 ? 's' : '');
                        renderGallery();
                    };
                    
                    request.onerror = function() {
                        console.error('Error deleting image');
                        alert('Failed to delete image. Please try again.');
                    };
                }
            }
            
            // Open image in fullscreen
            function openFullscreen(index) {
                currentImageIndex = index;
                fullscreenImage.src = images[index].data;
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
            
            // Close fullscreen view
            function closeFullscreen() {
                overlay.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
            
            // Navigate to previous image
            function showPrevImage() {
                currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
                fullscreenImage.src = images[currentImageIndex].data;
            }
            
            // Navigate to next image
            function showNextImage() {
                currentImageIndex = (currentImageIndex + 1) % images.length;
                fullscreenImage.src = images[currentImageIndex].data;
            }
            
            // Handle file selection
            function handleFileSelect(event) {
                const files = event.target.files;
                
                if (files.length === 0) return;
                
                // Check if we have enough storage space
                const currentUsage = calculateStorageUsage();
                
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    
                    if (!file.type.match('image.*')) continue;
                    
                    // Check if adding this file would exceed the limit
                    if (currentUsage + file.size > MAX_STORAGE) {
                        alert('Cannot add image: Storage limit would be exceeded. Maximum storage is 5MB.');
                        continue;
                    }
                    
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        // Store image in database
                        const transaction = db.transaction([STORE_NAME], 'readwrite');
                        const store = transaction.objectStore(STORE_NAME);
                        
                        const imageData = {
                            data: e.target.result,
                            name: file.name,
                            type: file.type,
                            size: file.size,
                            timestamp: new Date().getTime()
                        };
                        
                        const request = store.add(imageData);
                        
                        request.onsuccess = function() {
                            // Add to local array
                            imageData.id = request.result;
                            images.push(imageData);
                            imageCount.textContent = images.length + ' image' + (images.length !== 1 ? 's' : '');
                            renderGallery();
                        };
                        
                        request.onerror = function() {
                            console.error('Error storing image in database');
                        };
                    };
                    
                    reader.readAsDataURL(file);
                }
                
                // Reset the file input
                fileInput.value = '';
            }
            
            // Event listeners
            closeBtn.addEventListener('click', closeFullscreen);
            prevBtn.addEventListener('click', showPrevImage);
            nextBtn.addEventListener('click', showNextImage);
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) closeFullscreen();
            });
            fileInput.addEventListener('change', handleFileSelect);
            
            // Keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (!overlay.classList.contains('active')) return;
                
                if (e.key === 'Escape') closeFullscreen();
                if (e.key === 'ArrowLeft') showPrevImage();
                if (e.key === 'ArrowRight') showNextImage();
            });
            
            // Initialize the application
            initDatabase();
        });
    </script>
</body>
</html>
